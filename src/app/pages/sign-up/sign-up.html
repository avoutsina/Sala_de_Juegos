<form class="signup-container">
  <h2 class="signup-title">Crear cuenta</h2>
  <p class="signup-subtitle">Completá tus datos para registrarte</p>

  <div class="mb-3">
    <label for="inputEmail" class="form-label">Email</label>
    <input
      type="email"
      class="form-control"
      id="inputEmail"
      aria-describedby="emailHelp"
      placeholder="tu@email.com"
    />
    <div id="emailHelp" class="form-text">Nunca compartiremos tu email con nadie.</div>
  </div>

  <div class="mb-3">
    <label for="inputNombre" class="form-label">Nombre</label>
    <input type="text" class="form-control" id="inputNombre" placeholder="Tu nombre" />
  </div>

  <div class="mb-3">
    <label for="inputApellido" class="form-label">Apellido</label>
    <input type="text" class="form-control" id="inputApellido" placeholder="Tu apellido" />
  </div>

  <div class="mb-3">
    <label for="inputEdad" class="form-label">Edad</label>
    <input
      type="number"
      class="form-control"
      id="inputEdad"
      placeholder="Tu edad"
      min="1"
      max="120"
    />
  </div>

  <div class="mb-3">
    <label for="inputPassword" class="form-label">Contraseña</label>
    <input type="password" class="form-control" id="inputPassword" placeholder="••••••••" />
  </div>

  <div class="d-flex justify-content-center mt-4">
    <button type="submit" class="btn btn-primary w-100">Registrarse</button>
  </div>
</form>
