<nav class="navbar navbar-expand-lg">
  <div class="container-fluid">
    <a class="navbar-brand" [routerLink]="['/home']">Juegarla</a>
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNavDropdown"
      aria-controls="navbarNavDropdown"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNavDropdown">
      <ul class="ms-auto navbar-nav mb-2 mb-lg-0 align-items-lg-center">
        <li class="nav-item">
          <a
            class="nav-link"
            [routerLink]="['/home']"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Home
          </a>
        </li>

        <li class="nav-item">
          <a
            class="nav-link"
            [routerLink]="['/sobre-mi']"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
          >
            Sobre mí
          </a>
        </li>

        <!-- ✅ Solo visible si NO está logueado -->
        <ng-container *ngIf="!usuario">
          <li class="nav-item">
            <a
              class="nav-link"
              [routerLink]="['/login']"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
            >
              Login
            </a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              [routerLink]="['/sign-up']"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
            >
              Registro
            </a>
          </li>
        </ng-container>

        <!-- ✅ Solo visible si está logueado -->
        <ng-container *ngIf="usuario">
          <li class="nav-item">
            <span class="nav-link text-muted small">{{ usuario.email }}</span>
          </li>
          <li class="nav-item">
            <button class="btn btn-outline-danger btn-sm ms-2" (click)="cerrarSesion()">
              Cerrar sesión
            </button>
          </li>
        </ng-container>
      </ul>
    </div>
  </div>
</nav>
