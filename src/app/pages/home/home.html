<div class="home-wrapper">

  <ng-container *ngIf="!usuario">
    <div class="home-guest text-center py-5">
      <h2 class="mb-2">Bienvenido a <span class="text-primary fw-bold">Juegarla</span></h2>
      <p class="text-muted mb-4">Iniciá sesión o creá una cuenta para comenzar a jugar.</p>
      <div class="d-flex justify-content-center gap-3">
        <a routerLink="/login" class="btn btn-primary px-4">Iniciar sesión</a>
        <a routerLink="/sign-up" class="btn btn-outline-primary px-4">Registrarme</a>
      </div>
    </div>
  </ng-container>


  <ng-container *ngIf="usuario">
    <div class="home-logged text-center py-5">
      <h2 class="mb-1">
        ¡Hola, <span class="text-primary fw-bold">{{ nombreMostrado }}</span
        >!
      </h2>
      <p class="text-muted mb-4">Elegí un juego para empezar.</p>

      <!-- Accesos a juegos (ampliá según tus rutas) -->
      <div class="d-flex flex-wrap justify-content-center gap-3 mb-4">
        <a routerLink="/mayor-menor" class="btn btn-outline-secondary px-4">Mayor o Menor</a>
        <a routerLink="/ahorcado" class="btn btn-outline-secondary px-4">Ahorcado</a>
        <a routerLink="/preguntados" class="btn btn-outline-secondary px-4">Preguntados</a>
      </div>


      <button class="btn btn-danger btn-sm" (click)="cerrarSesion()">Cerrar sesión</button>
    </div>
  </ng-container>
</div>
