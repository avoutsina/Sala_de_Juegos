<form class="signup-container" (ngSubmit)="onSubmit()" novalidate>
  <h3 class="signup-title">Crear cuenta</h3>
  <p class="signup-subtitle">Completá tus datos para registrarte</p>

  <!-- ✅ Mensaje de error (usuario ya registrado u otros) -->
  <div class="alert alert-danger py-2 small" *ngIf="errorMsg">
    {{ errorMsg }}
  </div>

  <div class="mb-3">
    <label for="inputEmail" class="form-label">Email</label>
    <input
      type="email"
      class="form-control"
      id="inputEmail"
      placeholder="tu@email.com"
      [(ngModel)]="email"
      name="email"
      [disabled]="cargando"
    />
  </div>

  <div class="mb-3">
    <label for="inputNombre" class="form-label">Nombre</label>
    <input
      type="text"
      class="form-control"
      id="inputNombre"
      placeholder="Tu nombre"
      [(ngModel)]="nombre"
      name="nombre"
      [disabled]="cargando"
    />
  </div>

  <div class="mb-3">
    <label for="inputApellido" class="form-label">Apellido</label>
    <input
      type="text"
      class="form-control"
      id="inputApellido"
      placeholder="Tu apellido"
      [(ngModel)]="apellido"
      name="apellido"
      [disabled]="cargando"
    />
  </div>

  <div class="mb-3">
    <label for="inputEdad" class="form-label">Edad</label>
    <input
      type="number"
      class="form-control"
      id="inputEdad"
      placeholder="Tu edad"
      [(ngModel)]="edad"
      name="edad"
      min="1"
      max="120"
      [disabled]="cargando"
    />
  </div>

  <div class="mb-3">
    <label for="inputPassword" class="form-label">Contraseña</label>
    <input
      type="password"
      class="form-control"
      id="inputPassword"
      placeholder="••••••••"
      [(ngModel)]="password"
      name="password"
      [disabled]="cargando"
    />
    <div class="form-text">Mínimo 6 caracteres.</div>
  </div>

  <div class="mb-3">
    <label for="inputConfirmar" class="form-label">Confirmar contraseña</label>
    <input
      type="password"
      class="form-control"
      id="inputConfirmar"
      placeholder="••••••••"
      [(ngModel)]="confirmarPassword"
      name="confirmarPassword"
      [disabled]="cargando"
    />
  </div>

  <!-- ✅ Botón submit — tras registro exitoso hace login y navega a Home -->
  <div class="d-flex justify-content-center mt-4">
    <button type="submit" class="btn btn-primary w-100" [disabled]="cargando">
      <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2"></span>
      {{ cargando ? 'Registrando...' : 'Registrarse' }}
    </button>
  </div>

  <p class="text-center mt-3 small">
    ¿Ya tenés cuenta?
    <a routerLink="/login" class="text-decoration-none fw-semibold">Iniciá sesión</a>
  </p>
</form>
